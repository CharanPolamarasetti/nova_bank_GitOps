apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: novabank-prod
  labels:
    app: frontend
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        environment: prod
    spec:
      serviceAccountName: frontend
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: 285065163560.dkr.ecr.ap-south-1.amazonaws.com/novabank/frontend:2
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
