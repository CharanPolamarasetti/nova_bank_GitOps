apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: novabank-prod
  labels:
    app: customer-service
    environment: prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        environment: prod
    spec:
      serviceAccountName: customer-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: customer-service
          image: charanpolamarasetti/novabank-customer-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: customer-service-config
            - secretRef:
                name: customer-service-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault

