environment: dev
image:
  repository: 285065163560.dkr.ecr.ap-south-1.amazonaws.com/novabank/account_service
  tag: "v1"
replicaCount: 1
containerPort: 8082
service: {port: 8082}
env:
  DB_PORT: "5432"
  DB_NAME: accountdb
  CUSTOMER_SERVICE_BASE_URL: http://customer-service:8081
  LOGGING_LEVEL_ROOT: WARN
externalSecret:
  enabled: true
  data:
    - {secretKey: DB_HOST, key: novabank/dev/db, property: host}
    - {secretKey: DB_USERNAME, key: novabank/dev/db, property: username}
    - {secretKey: DB_PASSWORD, key: novabank/dev/db, property: password}
    - {secretKey: JWT_SECRET, key: novabank/dev/jwt, property: secret}
podSecurityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
autoscaling: {enabled: false, minReplicas: 3, maxReplicas: 6, cpuUtilization: 70}
networkPolicy:
  allowFromApps: [frontend]
